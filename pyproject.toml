[project]
name = "jiri"
version = "0.1.0"
description = "积日：本地优先的日课视频归档与转写工具"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12,<1",
  "rich>=13,<15",
  "mlx-whisper>=0.4.3,<0.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
transcription = [
  "faster-whisper>=1.1,<2",
]
analysis = [
  "openai>=1,<2",
  "pydantic>=2,<3",
  "tenacity>=9,<10",
]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
jiri = "jiri.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jiri"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
